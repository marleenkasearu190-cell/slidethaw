name: Portable checks

# Initial private upload does not auto-start a billed private-repository workflow.
# Maintainers can dispatch this explicitly; public pull requests run portable tests.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s skills/rebuild-ppt-image-compare/tests -v
      - run: python -B -m unittest discover -s tests -v
      - run: python tools/check_links.py
