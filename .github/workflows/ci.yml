name: Portable checks

# Portable checks only; desktop rendering and editing require separate local evidence.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6
        with:
          python-version: '3.12'
      - name: 安装便携依赖
        run: python -m pip install -r requirements.txt
      - name: 原始 Skill 单元测试
        run: python -B -m unittest discover -s skills/rebuild-ppt-image-compare/tests -v
      - name: 打包与文档回归测试
        run: python -B -m unittest discover -s tests -v
      - name: 本地 Markdown 文件与图片链接
        run: python tools/check_links.py
